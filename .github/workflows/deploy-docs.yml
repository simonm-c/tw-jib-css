name: Deploy VitePress to GitHub Pages

# Called by release-please.yml once publish.yml has staged a release, which is
# before `pnpm stage approve`: a rejected version's docs stay live until the
# next deploy. Dispatch redeploys any tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose docs to deploy, e.g. tw-jib-css-v2.0.0'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # refs/tags/ rather than the bare input is the whole validation: a branch
      # name or a typo fails to resolve here instead of quietly deploying
      # whatever main points at, which is the drift this workflow exists to
      # avoid.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # llms.txt and llms-full.txt are not in the tree. They are written into
      # docs/public/, which VitePress copies verbatim, so this has to run BEFORE
      # the build or the deployed site loses both files and the README's links
      # to them start 404ing.
      - run: pnpm run build:llm-docs

      # Two VitePress instances share this one Pages site: stable at the root,
      # experimental nested beneath it so the tree matches the
      # base: '/tw-jib-css/experimental/' that instance's config declares.
      # Stable builds first – its build empties its own dist, which would take
      # the nested copy with it.
      - run: pnpm run build:docs
      - run: pnpm run build:docs:experimental
      - run: cp -r docs-experimental/.vitepress/dist docs/.vitepress/dist/experimental

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
