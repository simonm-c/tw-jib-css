name: Publish

# A v* tag covers 1.0.0, which predates the release-please manifest and so is
# the one release the manifest cannot cut. Everything after it arrives through
# release-please.yml calling this workflow when a release PR merges.
# workflow_dispatch re-stages a version after a rejection, which needs no tag.
#
# Staging only: `pnpm install` does not resolve a staged version. `pnpm stage
# approve` promotes it and takes the 2FA; `pnpm stage reject` frees the semver
# slot and the dist-tag, which are otherwise held.
on:
  push:
    tags: ['v*']
  workflow_call:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      # A pull_request caller's default ref is refs/pull/N/merge, not the merge
      # commit on main. Empty on other events, so the default ref applies.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:css
      # tw-jib-css-merge publishes dist/, compiled from its TypeScript source.
      - run: pnpm build:merge
      - run: pnpm test:merge
      # -r is load-bearing. The workspace root is private and publishes
      # nothing, so a bare `pnpm stage publish` targets the root rather than the
      # packages under packages/, and the release reaches npm empty.
      - run: pnpm stage publish -r --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # release-please writes its own GitHub release. Under workflow_call,
      # github.event_name is the caller's: release-please.yml's push to main.
      # The release lands while the staged version is still unapproved.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
