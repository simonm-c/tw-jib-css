name: Release Please

# GitHub can drop a merge's push event, so a release PR's merge is also caught
# as pull_request and relayed. Whichever release-please run comes second finds
# the PR labelled `autorelease: tagged` and cuts nothing.
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# A group holds one pending run and a newer one cancels it; sharing would let a
# pull_request run, which cuts nothing, displace a waiting release run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_id || 'release-please' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # npm-publish's deployment rules reject refs/pull/N/merge, a pull_request
  # run's ref. workflow_dispatch is exempt from GITHUB_TOKEN events starting no
  # runs.
  relay:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run release-please.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  release-please:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs['packages/tw-jib-css--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A PR opened with GITHUB_TOKEN cannot trigger further workflows, so
          # CI never runs on the release PR and a required status check on it
          # can never clear. Setting RELEASE_PLEASE_TOKEN to a PAT lifts that;
          # without one this falls back and the PR simply arrives unchecked.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  deploy-docs:
    needs: [release-please, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
