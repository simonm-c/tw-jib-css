<?xml version="1.0" encoding="UTF-8"?>
<!--
  The sail tapers to a point at the head, so its drawn mass sits low in its
  bounding box — the area centroid lands two thirds of the way down. Centring
  the bounding box reads bottom-heavy, and centring the centroid strands the
  apex against the top edge because the eye still reads the silhouette. This
  translate puts a point three tenths of the way from box centre toward the
  centroid at the middle of the square, which balances both readings.
-->
<svg width="100%" height="100%" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(-91.577639,-115.055196) scale(5.519651)">
    <path d="M32.35,24.07L50.67,54.41C42.61,59.64,34.78,60.9,29.43,60.07C34.39,50.2,36.79,39.66,32.35,24.07Z" fill="oklch(74.6% 0.16 232.661)"/>
  </g>
</svg>
